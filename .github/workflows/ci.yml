name: CI
on:
  pull_request:
  push:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The report renderer shells out to pandoc (LLP 0193 open question 1: keep the
      # dependency, install it here). Without this the render tests skip rather than
      # fail, which would silently leave the renderer uncovered on the only platform
      # CI has.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: npm i
      - run: npm test
