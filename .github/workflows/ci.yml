# The typecheck, Node test matrix and LangGraph SDK job, times the
# PRs in flight, put enough concurrent cold
# `npm i` runs against the registry to burn the whole job budget before a test
# ran, reddening the required gate on PRs that failed nothing (issue #1313), so
# the npm cache directory is restored across runs. package-lock.json is
# gitignored here, so the cache key is hashed from package.json:
# `cache-dependency-path` must name a file that exists or setup-node fails
# looking for a lock file, and `npm ci` is unavailable for the same reason. The
# budget absorbs a genuinely cold install rather than killing one mid-install.
name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package.json
      - run: npm i
      - run: npm test

  langgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure isolated SDK paths
        run: |
          echo "HYP_LANGGRAPH_POC_DEPS=$RUNNER_TEMP/langgraph-js" >> "$GITHUB_ENV"
          echo "HYP_LANGGRAPH_PYTHON=$RUNNER_TEMP/langgraph-python/bin/python" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm i
      - name: Install isolated SDK test dependencies
        run: |
          npm install --prefix "$HYP_LANGGRAPH_POC_DEPS" --ignore-scripts --no-audit --no-fund \
            @langchain/langgraph@1.5.0 @langchain/core@1.2.18 \
            @langchain/openai@1.6.2 @langchain/anthropic@1.5.12 zod@4.6.7
          python -m venv "$RUNNER_TEMP/langgraph-python"
          "$HYP_LANGGRAPH_PYTHON" -m pip install langgraph==1.2.16 langchain-core==1.6.12 langchain-openai==1.7.2
      - name: Plugin wiring, privacy and recovery
        run: npm run smoke -- langgraph_capture
      - name: Real SDK callbacks and durable replay, without model credentials
        run: |
          node scripts/langgraph-poc/production.mjs
          node scripts/langgraph-poc/production.mjs --python
          node scripts/langgraph-poc/production.mjs --python --async
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langgraph-sdk-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/hyp-langgraph-production-*/results.json
            ${{ runner.temp }}/hyp-langgraph-production-*/agent.log
            ${{ runner.temp }}/hyp-langgraph-production-*/home/.hyp/hypaware/dev-telemetry/*.jsonl

  required:
    name: CI required
    if: ${{ always() }}
    needs: [typecheck, test, langgraph]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm required jobs passed
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LANGGRAPH_RESULT: ${{ needs.langgraph.result }}
        run: |
          test "$TYPECHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$LANGGRAPH_RESULT" = success
