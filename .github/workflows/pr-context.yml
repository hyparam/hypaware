name: PR decision context
'on':
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hypaware-pr-context-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  describe:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/hypaware-pr-context
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Update cited PR context
        env:
          GH_TOKEN: ${{ github.token }}
          HYP_PR_CONTEXT_TOKEN: ${{ secrets.HYP_PR_CONTEXT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.HYP_PR_CONTEXT_MODEL }}
        run: node .github/hypaware-pr-context/describe.mjs
