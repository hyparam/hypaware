name: Temporary PR 1013 decision context demo
on:
  pull_request:
    types: [ready_for_review, synchronize]
    paths:
      - .github/pr-decision-demo/**
      - .github/workflows/pr-decision-trail-demo.yml
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-decision-demo-1013-20261113
  cancel-in-progress: false
jobs:
  demo:
    if: github.event.pull_request.draft == false && github.head_ref == 'codex/pr-1013-context-demo-20261113' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify evidence and section guards
        run: node --test .github/pr-decision-demo/run.test.mjs
      - name: Fetch evidence and augment PR 1013
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HYP_PR_DEMO_QUERY_TOKEN: ${{ secrets.HYP_PR_DEMO_QUERY_TOKEN }}
          HYP_PR_DEMO_OPENAI_KEY: ${{ secrets.HYP_PR_DEMO_OPENAI_KEY }}
        run: node .github/pr-decision-demo/run.mjs
